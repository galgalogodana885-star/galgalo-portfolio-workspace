<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Galgalo Godana favicon</title>
  <desc id="desc">Rounded profile image favicon for Galgalo Godana.</desc>
  <defs>
    <clipPath id="profileClip">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
  </defs>
  <g clip-path="url(#profileClip)">
    <image href="data:image/png;base64," x="2" y="2" width="60" height="60" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>